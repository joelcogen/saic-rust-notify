[package]
name = "saic-rust-notify"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = "0.4"
rumqttc = { version = "0.25", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
