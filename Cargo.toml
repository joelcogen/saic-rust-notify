[package]
name = "saic-rust-notify"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
chrono = "0.4"
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
saic-client = { version = "0.1.0", path = "../saic-rust-client" }
dotenvy = "0.15.7"
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
